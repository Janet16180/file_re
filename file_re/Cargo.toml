[package]
name = "file_re"
version = "2.0.1"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "file_re"
crate-type = ["cdylib"]

[dependencies]
pyo3 = "0.30.1"
flate2 = "1.1.11"
regex-automata = "0.4.19"
memchr = "2.8.3"
bytecount = { version = "0.6.9", features = ["runtime-dispatch-simd"] }
liblzma = "0.4.9"
